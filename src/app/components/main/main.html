<section>
    @for (item of allProducts; track $index) {
        <div>
            <img [src]="item.featuredImage" alt="">
            <div>
                <h2>{{item.name}}</h2>
            </div>
        </div>
    }
</section>
<div class="rooms">
    @for (item of allProducts; track $index) {
        <ul>
            <li (click)="allRooms(item.id)">{{item.name}}</li>
        </ul>
    }
</div>
